[project]
name = "harbor"
version = "0.1.0"
description = "Deploy + SRE assistant: diagnoses and fixes apps on a PaaS through its API, with user approval"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "httpx==0.28.1",
    "pydantic>=2.9,<3",
    "tzdata>=2024.1",
    "anthropic==2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "duckdb>=1.1",
    "pytz",
]

[tool.pytest.ini_options]
testpaths = ["liara/tests"]

[tool.uv]
package = false
